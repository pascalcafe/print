version: "3.9"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: easyprint
      POSTGRES_USER: easyprint
      POSTGRES_PASSWORD: easyprint
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easyprint"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    # Optional: only required if you enable background workers.
    # Start explicitly with `docker compose --profile optional up`.
    profiles: ["optional"]
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    # Optional: message broker for async processing; opt-in profile.
    profiles: ["optional"]
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: easyprint
      RABBITMQ_DEFAULT_PASS: easyprint

  # Migration runner: executes `prisma migrate deploy` once before API starts
  migration:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    command: >
      sh -c "\
      pnpm --filter @easyprint/api prisma:deploy\
      "
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./env.production
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    ports:
      - "4000:4000"
    env_file:
      - ./env.production
    depends_on:
      migration:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./env.production
    depends_on:
      - api
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    env_file:
      - ./env.production
    # Worker is optional until queue consumers are implemented/configured.
    # Run with `docker compose --profile optional up worker` when required.
    profiles: ["optional"]
    depends_on:
      - api
      - redis
      - rabbitmq
    restart: unless-stopped

volumes:
  postgres_prod_data:
