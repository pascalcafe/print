name: Smoke Tests

on:
  push:
    branches:
      - main
      - chat-monitoring
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: easyprint
          POSTGRES_USER: easyprint
          POSTGRES_PASSWORD: easyprint
        ports:
          - 5432:5432
        options: >-
          --health-cmd='pg_isready -U easyprint -d easyprint' --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: postgresql://easyprint:easyprint@localhost:5432/easyprint?schema=public
      PORT: 4000
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack and setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.14.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install PostgreSQL client utilities
        run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client

      - name: Wait for Postgres
        run: |
          echo "Waiting for Postgres to be ready..."
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U easyprint && break || sleep 2
          done

      - name: Run Prisma migrations (retry)
        run: |
          for i in {1..10}; do
            pnpm --filter @easyprint/api run prisma:deploy && break || sleep 5
          done

      - name: Build API
        run: pnpm --filter @easyprint/api build

      - name: Start API in background
        run: |
          node dist/apps/api/src/main.js &
          echo $! > .api_pid

      - name: Wait for /api/health
        run: |
          for i in {1..30}; do
            if curl -sSf http://localhost:4000/api/health; then
              echo "API is healthy" && break
            fi
            sleep 2
          done

      - name: "Smoke check: /api/health content"
        run: |
          resp=$(curl -s http://localhost:4000/api/health)
          echo "Response: $resp"
          echo $resp | grep -q 'ok'

      - name: Teardown API
        if: always()
        run: |
          if [ -f .api_pid ]; then
            kill "$(cat .api_pid)" || true
          fi
