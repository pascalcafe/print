services:
  - type: web
    name: easyprint-api
    runtime: image
    repo: https://github.com/pascalcafe/EasyPrint
    dockerfilePath: ./apps/api/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: easyprint-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: easyprint-redis
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
    healthCheckPath: /api/health/ready

databases:
  - name: easyprint-db
    plan: free

redis:
  - name: easyprint-redis
    plan: free